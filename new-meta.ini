[custom]
; ==========================================================
; 个人定制版 v2 · 分组按截图重排 + emoji 补全
; 16 个业务组，顺序与客户端「显示排序」完全一致：
;   ⏱️ Speedtest → 🤖 OpenAI → 🐳 Docker → 🐙 Github → ✈️ Telegram
;   → 🎧 Spotify → 🎵 TikTok → 🎞️ Emby → 📺 Youtube → 🔍 Google
;   → 🪟 Microsoft → 🍎 Apple → 🎮 Games → 🌍 国外 → 🇨🇳 国内 → 🐟 其他
; ==========================================================
; 相对 v1 的结构变化：
; 1. 组名沿用截图英文命名，前面统一补 emoji 图标；
;    16 个业务组 + 7 个底层组全部带图标，不再出现有图标/没图标混搭。
; 2. 兜底逻辑合并为三层：国外（境外流量）/ 国内（境内流量）/ 其他（FINAL）。
; 3. 广告拦截、BT tracker、私网、非标端口不再单独占组，
;    直接硬编码 REJECT / DIRECT，省掉 4 个组。
; 4. Emby 用 GEOSITE,category-emby（内置）+ blackmatrix7 / Repcz 两份经典格式
;    规则集三重兜底，已确认三个来源均有效。
; 5. 新增 13.5 节：ProxyLite（代理）→ Pt-tracker（直连）→ PrivateTracker（直连），
;    三份列表按此顺序插入，顺序不可调换（原因见该节注释）。
; 6. 拦截规则用 NC-0425 的 Reject.list（Autodesk 反盗版，20 条），
;    硬编码 REJECT 置顶，不占策略组，分组保持截图上的 16 个。
; ==========================================================
; 说明：OpenClash 的策略组按文件内书写顺序生成，因此「文件顺序 = UI 顺序」。
; 末尾第 3 节是 7 个底层支撑组（地区测速 / 自动 / 全节点），
; 它们是上面 16 个组的下拉选项，必须存在，OpenClash 会排在列表最后。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; 节点清洗：剔除机场展示 / 说明 / 防失联 / 流量提示节点
exclude=剩余流量|流量重置|套餐|到期|过期|重置|官网|网站|最新网址|防失联|失联|公告|通知|Telegram|电报|客服|工单|订阅|试用|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下，先匹配先生效）
; ==========================================================

; --- 拦截（REJECT）：排在最前，确保拒绝优先于整个规则链 ---
; 来源 NC-0425/rule 的 Reject.list（已修正为纯经典格式，可直接加载）
; 当前内容：20 条 Autodesk（AutoCAD / Revit / Maya 等）的反盗版检测、
;           许可证验证、遥测上报域名，全部为 *.autodesk.com 后缀。
; 说明 1：这里用 raw 源而不是 jsdelivr —— jsdelivr 对分支引用有约 12 小时
;         缓存，作者改完仍会返回旧的混杂内容；raw 源约 5 分钟即同步。
;         若你的网络访问 raw.githubusercontent.com 失败，改用下面注释的镜像行。
; 说明 2：若开启「绕过大陆」，国内可直连的域名会绕过内核，REJECT 拦不住，
;         需在【流量控制】→【绕过指定区域 IPv4 黑名单】补：
;   autodesk.com / adobe.com / adobelogin.com / adobe.io / behance.net
ruleset=REJECT,clash-classic:https://raw.githubusercontent.com/NC-0425/rule/refs/heads/main/Reject.list,86400
; 备用镜像（jsdelivr 缓存 12h，作者更新后可能延迟）：
; ruleset=REJECT,clash-classic:https://testingcf.jsdelivr.net/gh/NC-0425/rule@main/Reject.list,86400

; --- 私网 / 局域网：硬编码直连，不占组 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 广告拦截：硬编码 REJECT（不需要时删掉这一行）---
ruleset=REJECT,[]GEOSITE,category-ads-all

; --- Aethersailor 补丁 ---
; 直连补丁：修正被误判为境外的国内域名
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
; 代理补丁：修正被误判为国内的境外域名（放在「国内」之前才有效）
ruleset=🌍 国外,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🌍 国外,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 1. Speedtest ---
ruleset=⏱️ Speedtest,[]GEOSITE,category-speedtest

; --- 2. OpenAI ---
ruleset=🤖 OpenAI,[]GEOSITE,openai
ruleset=🤖 OpenAI,[]GEOSITE,category-ai-!cn

; --- 3. Docker ---
ruleset=🐳 Docker,[]GEOSITE,docker

; --- 4. Github ---
ruleset=🐙 Github,[]GEOSITE,github

; --- 5. Telegram ---
ruleset=✈️ Telegram,[]GEOSITE,telegram

; --- 6. Spotify ---
ruleset=🎧 Spotify,[]GEOSITE,spotify

; --- 7. TikTok ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok

; --- 8. Emby ---
; 三层来源，从快到慢：
;   a) GEOSITE,category-emby —— 内置标签，已核实存在，不走网络，优先命中
;   b) blackmatrix7 规则集 —— 覆盖 52 条（含 DOMAIN-KEYWORD / PROCESS-NAME）
;   c) Repcz 规则集 —— 覆盖 195 条（含 Emby 服务商 IP-CIDR）
; 注意：b、c 两份都是经典格式（DOMAIN-SUFFIX,xxx），必须用 clash-classic:，
;       写成 clash-domain: 会因缺少 payload 结构解析失败。
; URL 统一走 jsdelivr 镜像，避免 raw.githubusercontent.com 在国内被阻断。
ruleset=🎞️ Emby,[]GEOSITE,category-emby
ruleset=🎞️ Emby,clash-classic:https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Emby/Emby.list,86400
ruleset=🎞️ Emby,clash-classic:https://testingcf.jsdelivr.net/gh/Repcz/Tool@X/Shadowrocket/Rules/Emby.list,86400

; --- 9. Youtube ---
ruleset=📺 Youtube,[]GEOSITE,youtube

; --- 10. Google ---
ruleset=🔍 Google,[]GEOSITE,google

; --- 11. Microsoft ---
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- 12. Apple ---
ruleset=🍎 Apple,[]GEOSITE,apple

; --- 13. Games ---
ruleset=🎮 Games,[]GEOSITE,category-games

; --- 13.5 PT / 影视工具补充（三份列表顺序不可调换）---
; 为什么顺序敏感：
;   ProxyLite      → DOMAIN,byr.pt          精确匹配「网页」，走代理
;   Pt-tracker     → DOMAIN,tracker.byr.pt  精确匹配「tracker」，走直连
;   PrivateTracker → DOMAIN-SUFFIX,byr.pt   整站后缀匹配，走直连
; 若把 PrivateTracker 提前，它的 DOMAIN-SUFFIX,byr.pt 会连 tracker.byr.pt
; 一起判定为直连，ProxyLite 的代理设置就失效了。必须保持 1 → 2 → 3。
;
; 1) ProxyLite：PT 站网页 + MoviePilot / TMDB / IMDb / PyPI 等配套，走代理
ruleset=🌍 国外,clash-classic:https://testingcf.jsdelivr.net/gh/NC-0425/rule@main/ProxyLite.list,86400
; 2) Pt-tracker：中文 PT 站 + tracker 关键字（tracker / announce / torrent），强制直连
;    列表作者明确要求直连：tracker 走代理会导致下载器 IP 不一致，被站点判盒子/封号
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/NC-0425/rule@main/Pt-tracker.list,86400
; 3) PrivateTracker：122 条国内外 PT 站域名，强制直连
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/PrivateTracker.list,86400

; --- 14. 国内 ---
ruleset=🇨🇳 国内,[]GEOSITE,cn
ruleset=🇨🇳 国内,[]GEOIP,cn,no-resolve
ruleset=🇨🇳 国内,[]GEOSITE,google-cn
; BT/PT：公共 tracker 直连，避免 announce 走代理耗流量
ruleset=DIRECT,[]GEOSITE,category-public-tracker
; 非标端口（BT 随机端口、SSH 等）直连
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 15. 国外：所有未被上面匹配的境外流量 ---
ruleset=🌍 国外,[]GEOSITE,geolocation-!cn
ruleset=🌍 国外,[]GEOSITE,gfw

; --- 16. 其他：最终兜底 ---
ruleset=🐟 其他,[]FINAL


; ==========================================================
; 2) 业务策略组（顺序 = 截图顺序）
;    首项即默认选择
; ==========================================================
;------------ 1-13 应用组 ------------
custom_proxy_group=⏱️ Speedtest`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]🧭 全部节点`[]DIRECT

; OpenAI / AI 类：HK 会被服务端拒绝，首项必须美/日
custom_proxy_group=🤖 OpenAI`select`[]🇺🇸 US`[]🇯🇵 JP`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]♻️ 自动选择`[]🌍 国外

custom_proxy_group=🐳 Docker`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]DIRECT`[]🌍 国外

custom_proxy_group=🐙 Github`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]DIRECT`[]🌍 国外

custom_proxy_group=✈️ Telegram`select`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇺🇸 US`[]♻️ 自动选择`[]🌍 国外

custom_proxy_group=🎧 Spotify`select`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇺🇸 US`[]♻️ 自动选择`[]🌍 国外

; TikTok：需要原生美区 IP
custom_proxy_group=🎵 TikTok`select`[]🇺🇸 US`[]🇯🇵 JP`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]♻️ 自动选择`[]🌍 国外

; Emby：默认走港区；服务商支持直连且流量吃紧时，把组切到 DIRECT
custom_proxy_group=🎞️ Emby`select`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]DIRECT`[]🌍 国外

custom_proxy_group=📺 Youtube`select`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇺🇸 US`[]♻️ 自动选择`[]🌍 国外

custom_proxy_group=🔍 Google`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇺🇸 US`[]♻️ 自动选择`[]DIRECT`[]🌍 国外

; Microsoft：国内 CDN 直连更快
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]🌍 国外

; Apple：同上，App Store / iCloud 直连更快
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]🌍 国外

; Games：默认直连（国内平台/CDN），外服加速时切 JP / US
custom_proxy_group=🎮 Games`select`[]DIRECT`[]🇯🇵 JP`[]🇺🇸 US`[]🇭🇰 HK`[]🇸🇬 SG`[]🇹🇼 TW`[]♻️ 自动选择`[]🌍 国外

;------------ 14-16 三层兜底 ------------
; 国外：境外流量总出口，首项 HK（你的默认偏好）
custom_proxy_group=🌍 国外`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]🧭 全部节点`[]DIRECT

; 国内：境内流量总出口，默认直连
custom_proxy_group=🇨🇳 国内`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]🧭 全部节点

; 其他：最终兜底，默认跟随国外
custom_proxy_group=🐟 其他`select`[]🌍 国外`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🇹🇼 TW`[]♻️ 自动选择`[]🧭 全部节点


; ==========================================================
; 3) 底层支撑组（上面 16 个组的下拉选项，必须存在）
;    OpenClash 会把它们生成在列表末尾；
;    支持隐藏分组的客户端（FlClash 等）可以把这 7 个隐藏
; ==========================================================
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,300

; 地区组：正则不含反斜杠转义，兼容 HK-01 / HK 03 / 香港01 等常见命名
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|HKG|HongKong|Hong Kong|HK[-_ ]?[0-9])`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|东京|東京|大阪|JPN|Japan|Tokyo|Osaka|JP[-_ ]?[0-9])`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|狮城|SGP|Singapore|SG[-_ ]?[0-9])`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|美國|USA|United States|Los Angeles|San Jose|Seattle|New York|Silicon Valley|US[-_ ]?[0-9])`https://www.gstatic.com/generate_204`300,300
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|TWN|Taiwan|Taipei|HiNet|CHT|TW[-_ ]?[0-9])`https://www.gstatic.com/generate_204`300,300

; 全节点：手动指定任意节点
custom_proxy_group=🧭 全部节点`select`.*
